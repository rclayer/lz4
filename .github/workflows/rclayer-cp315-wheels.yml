name: Publish CPython 3.15 wheels

on:
  push:
    tags:
      - rclayer-cp315-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            linux_arch: x86_64
            macos_arch: ''
            windows_arch: ''
          - os: ubuntu-24.04-arm
            linux_arch: aarch64
            macos_arch: ''
            windows_arch: ''
          - os: macos-14
            linux_arch: ''
            macos_arch: arm64
            windows_arch: ''
          - os: windows-latest
            linux_arch: ''
            macos_arch: ''
            windows_arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - run: python -m pip install --disable-pip-version-check cibuildwheel==4.3.4
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp315-*
          CIBW_SKIP: '*-musllinux_*'
          CIBW_ARCHS_LINUX: ${{ matrix.linux_arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.macos_arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.windows_arch }}
          CIBW_ENVIRONMENT: SETUPTOOLS_SCM_PRETEND_VERSION=4.4.5
          CIBW_TEST_COMMAND: python -c "import lz4.frame; data = bytes([119]); assert lz4.frame.decompress(lz4.frame.compress(data)) == data"
          CIBW_BUILD_VERBOSITY: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rclayer-cp315-v4.4.5
          files: wheelhouse/*.whl
          overwrite_files: true
          fail_on_unmatched_files: true
